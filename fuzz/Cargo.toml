[package]
name = "rskrb5-patched-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
rskrb5 = { version = "0.3.0", path = "..", package = "rskrb5-patched" }

[[bin]]
name = "kpasswd_reply"
path = "fuzz_targets/kpasswd_reply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ccache_parse"
path = "fuzz_targets/ccache_parse.rs"
test = false
doc = false
bench = false
