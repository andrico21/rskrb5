# clippy.toml - workspace root
avoid-breaking-exported-api = false       # report even when the fix changes public API
check-private-items = true                # missing_*_doc lints cover private items too
allow-unwrap-in-tests = false             # tests follow the same panic rules
allow-expect-in-tests = false
allow-panic-in-tests = false
allow-dbg-in-tests = false
allow-print-in-tests = false
allow-indexing-slicing-in-tests = false
warn-on-all-wildcard-imports = true
allow-mixed-uninlined-format-args = false
cognitive-complexity-threshold = 25       # drives `cognitive_complexity`
too-many-lines-threshold = 100            # drives `too_many_lines`
max-fn-params-bools = 3                   # drives `fn_params_excessive_bools`
enum-variant-size-threshold = 200         # drives `large_enum_variant`
doc-valid-idents = [".."]                 # ".." keeps Clippy's defaults; append proper nouns

# Every unavoidable duplicate, mirrored in deny.toml `[bans] skip`; each
# chain was reported by `cargo tree -i <crate>@<version> -e normal --all-features`
# (the ring edges by the `cargo metadata` resolve, see below).
allowed-duplicate-crates = [
  "syn", # =2.0.119: rasn-derive / rasn-derive-impl 0.29.0, snafu-derive 0.8.9 (rasn 0.29.0) and zeroize_derive 1.5.0; 3.0.9 elsewhere
  # Needed by Clippy only (cargo-deny's feature-aware graph never reaches ring,
  # so `cargo deny check` reports these two skips as unmatched): Clippy
  # reads the feature-agnostic `cargo metadata` resolve, where the optional
  # hickory-proto 0.26.3 -> ring 0.17.14 edge pulls getrandom 0.2.17 and
  # windows-sys 0.52.0 (aarch64 Windows only). getrandom 0.4.3 is the direct
  # dependency (also via rand 0.10.3 and uuid 1.29.0); windows-sys 0.61.2
  # arrives via tokio 1.54.1, mio, socket2 and ipconfig.
  "getrandom",
  "windows-sys",
]
