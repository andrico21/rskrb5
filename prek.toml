#:schema https://www.schemastore.org/prek.json

# Mirrors the blocking CI jobs that are cheap enough for a hook: `fmt`,
# `lint-gates`, `deny`, `machete`, `taplo`, `vet`, the guideline checksums of
# `docs-validate`, the compatibility report of `readme-commands`, and a
# three-closure smoke of the `closures` matrix (CI runs every closure).

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "bash -c 'cargo +nightly-2026-10-03 fmt --all -- --check && cargo +nightly-2026-10-03 fmt --manifest-path fuzz/Cargo.toml -- --check'"
files = "\\.rs$|Cargo\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "lint-gates"
name = "lint gates"
language = "system"
entry = "bash -c 'export PYTHONDONTWRITEBYTECODE=1; for s in scripts/lint-gates/*.py; do python3 \"$s\" --self-test || exit 1; done && python3 scripts/lint-gates/allow_gate.py --enforce && python3 scripts/lint-gates/exception_gate.py --enforce && python3 scripts/lint-gates/profile_eq.py --clippy-toml && python3 scripts/lint-gates/completeness_check.py && python3 scripts/lint-gates/facade_gate.py --enforce && python3 scripts/lint-gates/prose_gate.py --enforce && python3 scripts/lint-gates/feature_closures.py check-ci .github/workflows/ci.yml && python3 scripts/lint-gates/fuzz_lint.py --enforce && python3 scripts/lint-gates/gate_hygiene.py --enforce && { rg -n lint-migration src tests examples fuzz; test $? -eq 1; }'"
files = "\\.(rs|toml|py|yml)$"
pass_filenames = false
stages = ["pre-push", "manual"]

[[repos.hooks]]
id = "cargo-deny"
name = "cargo deny"
language = "system"
entry = "cargo deny check"
pass_filenames = false
stages = ["pre-push", "manual"]

[[repos.hooks]]
id = "cargo-machete"
name = "cargo machete"
language = "system"
entry = "cargo machete"
pass_filenames = false
stages = ["pre-push", "manual"]

[[repos.hooks]]
id = "taplo"
name = "taplo fmt"
language = "system"
entry = "taplo fmt --check"
pass_filenames = false
stages = ["pre-push", "manual"]

[[repos.hooks]]
id = "cargo-vet"
name = "cargo vet"
language = "system"
entry = "cargo vet --locked"
pass_filenames = false
stages = ["pre-push", "manual"]

[[repos.hooks]]
id = "guidelines-checksums"
name = "guidelines checksums"
language = "system"
entry = "bash -c 'cd docs/rust-guidelines && sha256sum -c SHA256SUMS'"
pass_filenames = false
stages = ["pre-push", "manual"]

[[repos.hooks]]
id = "closures-smoke"
name = "strict clippy and tests in three feature closures"
language = "system"
entry = "bash -c 'set -e; for c in --all-features --no-default-features \"--no-default-features --features tokio\"; do cargo clippy --all-targets $c -- -D warnings; cargo test $c; done'"
files = "\\.rs$|Cargo\\.(toml|lock)$"
pass_filenames = false
stages = ["pre-push", "manual"]

[[repos.hooks]]
id = "compat-report"
name = "compatibility report is current"
language = "system"
entry = "bash -c 'cargo run --quiet --no-default-features --features evaluation --bin rskrb5-ng-compat-report > /tmp/rskrb5-compatibility-report.md && diff -u docs/compatibility-report.md /tmp/rskrb5-compatibility-report.md'"
files = "src/evaluation(/.*)?\\.rs|src/bin/rskrb5-compat-report\\.rs|docs/compatibility-report\\.md"
pass_filenames = false
stages = ["pre-push", "manual"]
