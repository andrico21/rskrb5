# deny.toml - package root
#
# The core sample from RUST_GUIDELINES.md (vendored andrico21/rust-guidelines
# @ 8b52023, Section 10), adjusted to this package: the license allowlist is
# exactly what the locked dependency graph needs, and every duplicate below is
# reasoned. Keep `[bans] skip` in step with `allowed-duplicate-crates` in
# clippy.toml, and `[advisories] ignore` equal to .cargo/audit.toml.

[graph]
all-features = true # optional dependencies are held to the same policy

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Scope, NOT a lint level: one of "all" | "workspace" | "transitive" | "none".
# "all" - transitive deps are where most RUSTSEC exposure actually lives.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Mirrored in .cargo/audit.toml; the two ignore sets must stay equal. Every
# entry names the advisory, why it does not apply and the upstream fix status.
ignore = []

[licenses]
confidence-threshold = 0.93
# Exactly the subset of the core sample and rmcp-server-kit's list that this
# graph needs; any further entry is reported as `license-not-encountered`.
# Dev-only dependencies are outside the license check (cargo-deny's
# `include-dev` default), so axum's matchit (`MIT AND BSD-3-Clause`) adds nothing.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "deny"   # unavoidable duplicates go into `skip`, each with a reason
wildcards = "deny"           # No * version specs
allow-wildcard-paths = false
highlight = "all"

# Every entry below is a duplicate this release cannot remove without an
# upstream release. Reasons are the reverse dependency chains reported by
# `cargo tree -i <crate>@<version> -e normal --all-features` (plus
# `--target all` for target-specific edges).
[[bans.skip]]
name = "syn"
version = "=2.0.119"
reason = "rasn-derive 0.29.0 / rasn-derive-impl 0.29.0 / snafu-derive 0.8.9 via rasn 0.29.0, and zeroize_derive 1.5.0 via zeroize 1.9.1; syn 3.0.9 is used by every other proc-macro"

# The two entries below are for Clippy's `multiple_crate_versions`, which
# reads the feature-agnostic `cargo metadata` resolve: there the optional
# hickory-proto 0.26.3 -> ring 0.17.14 edge is present, so `cargo tree -i`
# on this feature-aware graph never reaches them. They keep this list equal to
# `allowed-duplicate-crates` in clippy.toml.
[[bans.skip]]
name = "getrandom"
version = "=0.2.17"
reason = "ring 0.17.14 -> hickory-proto 0.26.3 (optional edge, cargo metadata resolve only); getrandom 0.4.3 is the rskrb5-ng direct dependency and arrives via rand 0.10.3 (hickory-net/hickory-proto/hickory-resolver 0.26.3, picky-krb 0.13.0) and uuid 1.29.0 (moka 0.12.16, picky-krb 0.13.0, rasn-derive-impl 0.29.0)"

[[bans.skip]]
name = "windows-sys"
version = "=0.52.0"
reason = "ring 0.17.14 -> hickory-proto 0.26.3 (optional edge, cargo metadata resolve only; aarch64 Windows only); windows-sys 0.61.2 arrives via tokio 1.54.1, mio 1.2.4, socket2 0.6.5 and ipconfig 0.3.4"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"                                         # git dependencies pinned to a commit
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
