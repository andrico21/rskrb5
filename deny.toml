# deny.toml - package root
#
# The core sample from RUST_GUIDELINES.md (vendored andrico21/rust-guidelines
# @ 8b52023, Section 10), adjusted to this package: the license allowlist is
# exactly what the locked dependency graph needs, and every duplicate below is
# reasoned. Keep `[bans] skip` in step with `allowed-duplicate-crates` in
# clippy.toml, and `[advisories] ignore` equal to .cargo/audit.toml.

[graph]
all-features = true # optional dependencies are held to the same policy

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Scope, NOT a lint level: one of "all" | "workspace" | "transitive" | "none".
# "all" - transitive deps are where most RUSTSEC exposure actually lives.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Mirrored in .cargo/audit.toml; the two ignore sets must stay equal. Every
# entry names the advisory, why it does not apply and the upstream fix status.
ignore = []

[licenses]
confidence-threshold = 0.93
# Exactly the subset of the core sample and rmcp-server-kit's list that this
# graph needs; any further entry is reported as `license-not-encountered`.
# Dev-only dependencies are outside the license check (cargo-deny's
# `include-dev` default), so axum's matchit (`MIT AND BSD-3-Clause`) adds nothing.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "deny"   # unavoidable duplicates go into `skip`, each with a reason
wildcards = "deny"           # No * version specs
allow-wildcard-paths = false
highlight = "all"

# Every entry below is a duplicate this release cannot remove without a
# dependency major-version upgrade (excluded for the 0.3 line) or an upstream
# release. Reasons are the reverse dependency chains reported by
# `cargo tree -i <crate>@<version> -e normal --all-features` (plus
# `--target all` for the UEFI-only edge).
[[bans.skip]]
name = "base64"
version = "=0.22.1"
reason = "rskrb5-patched direct dependency (spnego feature); base64 0.23.1 arrives via picky-krb 0.12.3 -> picky-asn1-x509 0.15.5 (evaluation feature)"

[[bans.skip]]
name = "getrandom"
version = "=0.3.4"
reason = "rskrb5-patched direct dependency; getrandom 0.4.3 arrives via rand 0.10.3 (hickory-net/hickory-proto/hickory-resolver 0.26.3, picky-krb 0.12.3) and uuid 1.29.0 (moka 0.12.16, picky-krb 0.12.3, rasn-derive-impl 0.28.15)"

[[bans.skip]]
name = "r-efi"
version = "=5.3.0"
reason = "getrandom 0.3.4 -> rskrb5-patched (UEFI target only); r-efi 6.0.0 arrives via getrandom 0.4.3"

[[bans.skip]]
name = "syn"
version = "=2.0.119"
reason = "rasn-derive 0.28.15 / rasn-derive-impl 0.28.15 / snafu-derive 0.8.9 via rasn 0.28.15, and zeroize_derive 1.5.0 via zeroize 1.9.1; syn 3.0.9 is used by every other proc-macro"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"                                         # git dependencies pinned to a commit
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
