name: Release

# The secret-free release coordinator. It runs after every completed `CI` run
# and uses no secret and no deployment environment. For a successful push or dispatch
# CI run of this repository it looks for an `N.N.N` release tag at the run's
# commit (`scripts/release-publish.sh find-tag`). Without one it prints
# "No N.N.N tag points at <sha>" and dispatches nothing. With one, it checks
# that the tag carries the `Cargo.toml` version and that the commit is on
# `main`, and, for the CI run on the tag ref itself, dispatches
# `publish.yml` at `refs/tags/<tag>` (`gh workflow run publish.yml --ref
# <tag>`; a `workflow_dispatch` started with `GITHUB_TOKEN` is allowed to
# start runs). The CI run on `main` for the same commit dispatches nothing,
# so a release is dispatched once.
#
# `publish.yml` re-validates all of this itself (it can be dispatched by hand
# too), builds and packages the crate in a token-free `verify` job, and
# uploads in its `publish` job, which runs in the reviewed `release`
# environment, the only holder of `CARGO_REGISTRY_TOKEN`. See
# docs/RELEASING.md.
#
# Repository settings this relies on (docs/review/release-ci.md):
#   - environment `release`: required reviewer `andrico21`, deployments only
#     from tags matching `[0-9]*.[0-9]*.[0-9]*`, no admin bypass, and the
#     `CARGO_REGISTRY_TOKEN` secret;
#   - tag ruleset "release tags" (25943056): creating, moving or deleting
#     `refs/tags/[0-9]*.[0-9]*.[0-9]*` is restricted to repository admins.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  find-tag:
    name: find-tag
    # Provenance gate (before any checkout): a succeeded CI run whose head
    # repository is THIS repo, triggered by push or a manual dispatch. Both
    # are non-fork-triggerable; pull_request runs never publish.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # The exact commit CI ran against, tags included for the lookup below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find an N.N.N tag pointing at this commit
        id: find-tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: bash scripts/release-publish.sh find-tag "$SHA" "$HEAD_BRANCH"

      - name: Check the tag, its version and its ancestry on main
        if: steps.find-tag.outputs.dispatch == 'true'
        env:
          TAG: ${{ steps.find-tag.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/release-publish.sh check-ref "refs/tags/$TAG" "$SHA"

      - name: Dispatch publish.yml at the tag
        if: steps.find-tag.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.find-tag.outputs.tag }}
        run: gh workflow run publish.yml --ref "$TAG" -R "$REPO"
