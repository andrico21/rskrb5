name: Publish

# Publishes `rskrb5-ng` to crates.io from one `N.N.N` release tag. The
# coordinator `release.yml` dispatches it at `refs/tags/<tag>` after a green
# CI run on that tag; the owner may also dispatch it by hand at a tag, which
# is the recovery path (docs/RELEASING.md). It runs only on
# `workflow_dispatch`, so `github.ref` is the dispatched tag ref, which the
# `release` environment's deployment policy (tags `[0-9]*.[0-9]*.[0-9]*`
# only) admits.
#
#   verify   no environment, no secret. Re-checks everything the coordinator
#            checked: the ref is `refs/tags/N.N.N` with the `Cargo.toml`
#            version, the tag points at `github.sha`, that commit is on
#            `main`, and a CI run of this repository for it (push or
#            dispatch) succeeded. It then verify-builds and packages the
#            crate (`cargo package --locked`) and uploads the `.crate` and its
#            sha256. All dependency build code runs here.
#   publish  `needs: verify`, in the `release` environment: it waits for the
#            owner's approval and is the only job that sees
#            `CARGO_REGISTRY_TOKEN`. It repeats the tag, SHA and ancestry
#            checks (the tag could have moved while it waited), re-packages
#            without building (`cargo package --locked --no-verify`), requires
#            the verified sha256, and uploads with `cargo publish --locked
#            --no-verify`. If the version is already on crates.io it downloads
#            the published `.crate` and requires the same sha256 instead. Only
#            then does it create the GitHub release, unless it exists.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      version: ${{ steps.ref.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag ref, its version and its ancestry on main
        id: ref
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: bash scripts/release-publish.sh check-ref "$REF" "$SHA"

      - name: Check that CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash scripts/release-publish.sh check-ci-run "$REPO" "$SHA"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Verify-build and package
        id: package
        run: bash scripts/release-publish.sh package "$RUNNER_TEMP/crate"

      - name: Upload the verified crate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-crate
          path: ${{ runner.temp }}/crate
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    # Required reviewer gate: the job, and the environment's registry token,
    # start only after the repository owner approves the deployment.
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      SHA256: ${{ needs.verify.outputs.sha256 }}
    steps:
      # No push credential is persisted into the tagged-tree checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Re-check the tag, its version and its ancestry on main
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: bash scripts/release-publish.sh check-ref "$REF" "$SHA"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Download the verified crate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-crate
          path: ${{ runner.temp }}/verified

      - name: The artifact is the verified package
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/verified"
          sha256sum --check "rskrb5-ng-$VERSION.crate.sha256"
          test "$(sha256sum "rskrb5-ng-$VERSION.crate" | cut -d' ' -f1)" = "$SHA256"

      # The only step with the token. `cargo package --no-verify` and `cargo
      # publish --no-verify` build nothing, so no dependency build code runs
      # in this job.
      - name: Publish, or verify the bytes already on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/release-publish.sh publish "$VERSION" "$SHA256"

      - name: Create the GitHub release unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-publish.sh release "$TAG" "$VERSION"
