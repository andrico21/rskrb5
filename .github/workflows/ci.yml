name: CI

# CI and the release gate: the secret-free coordinator `release.yml` runs on
# this workflow's completion. Its `find-tag` job looks for an `N.N.N` tag at
# the run's head SHA and, for the CI run on that tag's ref, dispatches
# `publish.yml` at the tag; `publish.yml` re-verifies the tag, the commit's
# ancestry on `main` and this workflow's success, and uploads only in the
# reviewed `release` environment (docs/RELEASING.md). Every job's `name:`
# equals its job id.
#
# Lint profile. The crate adopts the core Section 9 `[lints]` tables of the
# vendored Rust guidelines unchanged, the core `clippy.toml` sample,
# `rustfmt.toml`, and `.cargo/config.toml` `build.warnings = "deny"`, so rustc
# warnings fail every job that does not override it explicitly.
#
# Toolchains (core Section 12 Version Policy). Rust jobs run on floating
# `stable` (never pinned, no `rust-toolchain.toml`). The dated
# `nightly-2026-10-03` is used only for rustfmt, rustdoc and the fuzz crate
# (`fuzz_lint.py`, `fuzz-build`, `fuzz`); `1.99.0` only for the MSRV build.
#
# Lint gates. There is no baseline: the tree passes the profile outright.
# `allow_gate.py` rejects any `allow`; `exception_gate.py` admits only the six
# sanctioned `expect` forms; `profile_eq.py` and `completeness_check.py` hold
# the profile equal to the vendored core and complete against current stable;
# `facade_gate.py` and `prose_gate.py` (whole tree) enforce the source rules;
# `feature_closures.py check-ci` holds the `closures` matrix equal to the
# computed feature closures. See `docs/lint-policy.md`.
#
# Vendored guidelines. `docs/rust-guidelines/` is checked against its
# SHA256SUMS in `docs-validate`; update it only by re-vendoring.
#
# Not in this workflow: the Docker MIT KDC integration gates and the Active
# Directory gate of the upstream `clelange/rskrb5` workflow. They run locally
# (`scripts/run-gated-integration.sh`, docs/gated-integration.md), and
# `workflow_dispatch` below declares no inputs, so
# `scripts/check-github-ad-gate.py --dispatch` refuses to dispatch.
# `docs/gokrb5-parity.toml` keeps their upstream runs as attributed historical
# evidence (gate status `historical-upstream`).
#
# Blocking: every job except the four advisory ones below. Advisory (never a
# merge gate, per core Section 12 "Recommended"): `geiger`,
# `rustdoc-nightly-canary`, and the scheduled/dispatch `fuzz` and `mutants`;
# they are the only jobs allowed to fail.

on:
  push:
    branches: [main]
    # Release tags (`N.N.N` without a `v`, creatable by repository admins
    # only, per the tag ruleset): `release.yml` dispatches `publish.yml` only
    # from a green run on the tag.
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  schedule:
    # Weekly, Monday 03:37 UTC: the advisory mutants + fuzz pass.
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are denied by the committed .cargo/config.toml ([build] warnings
  # = "deny"), for every job.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-03
          components: rustfmt
      - name: rustfmt (crate)
        run: cargo +nightly-2026-10-03 fmt --all -- --check
      - name: rustfmt (fuzz crate)
        run: cargo +nightly-2026-10-03 fmt --manifest-path fuzz/Cargo.toml -- --check

  closures:
    name: closures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every feature closure, as `feature_closures.py list` prints its
        # canonical arguments; `lint-gates` runs `feature_closures.py check-ci`
        # so this list cannot drift from Cargo.toml `[features]`.
        closures:
          - "--no-default-features"
          - "--no-default-features --features messages"
          - "--no-default-features --features serde"
          - "--no-default-features --features messages,serde"
          - "--no-default-features --features spnego"
          - "--no-default-features --features tokio"
          - "--no-default-features --features evaluation"
          - "--no-default-features --features http"
          - "--no-default-features --features serde,spnego"
          - "--no-default-features --features serde,tokio"
          - "--no-default-features --features spnego,tokio"
          - "--no-default-features --features evaluation,http"
          - "--no-default-features --features evaluation,serde"
          - "--no-default-features --features evaluation,tokio"
          - "--no-default-features --features http,serde"
          - "--no-default-features --features http,tokio"
          - "--no-default-features --features tower"
          - "--no-default-features --features serde,spnego,tokio"
          - ""
          - "--no-default-features --features evaluation,http,serde"
          - "--no-default-features --features evaluation,http,tokio"
          - "--no-default-features --features evaluation,tower"
          - "--no-default-features --features evaluation,serde,tokio"
          - "--no-default-features --features http,serde,tokio"
          - "--no-default-features --features serde,tower"
          - "--no-default-features --features tokio,tower"
          - "--features evaluation"
          - "--features http"
          - "--no-default-features --features evaluation,http,serde,tokio"
          - "--no-default-features --features evaluation,serde,tower"
          - "--no-default-features --features evaluation,tokio,tower"
          - "--no-default-features --features serde,tokio,tower"
          - "--features evaluation,http"
          - "--features tower"
          - "--no-default-features --features evaluation,serde,tokio,tower"
          - "--all-features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: closure-${{ strategy.job-index }}
      - name: Clippy (${{ matrix.closures }})
        run: cargo clippy --all-targets ${{ matrix.closures }} -- -D warnings
      - name: Test (${{ matrix.closures }})
        run: cargo test ${{ matrix.closures }}

  clippy-windows:
    name: clippy-windows
    # Code that is dead outside `cfg(unix)` only fails on a Windows target.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy (--all-features, Windows)
        run: cargo clippy --all-targets --all-features -- -D warnings

  lib-feature-sets:
    name: lib-feature-sets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Library-only and binary-only builds a path-dependency consumer or
        # the README can select. `cargo check` keeps the committed
        # `build.warnings = "deny"`.
        args:
          - "--lib --no-default-features --features messages"
          - "--lib --no-default-features --features spnego"
          - "--lib --no-default-features --features http"
          - "--lib --no-default-features --features evaluation"
          - "--no-default-features --features evaluation --bin rskrb5-ng-compat-report"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check (${{ matrix.args }})
        run: cargo check ${{ matrix.args }}

  readme-commands:
    name: readme-commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # README "Examples": the Axum example with only the `http` feature.
      - name: Build the axum-negotiate example (--no-default-features --features http)
        run: cargo build --example axum-negotiate --features http --no-default-features
      # README "Compatibility report", as the prek `compat-report` hook runs it.
      - name: The compatibility report is current
        run: |
          cargo run --quiet --no-default-features --features evaluation --bin rskrb5-ng-compat-report > "$RUNNER_TEMP/compatibility-report.md"
          diff -u docs/compatibility-report.md "$RUNNER_TEMP/compatibility-report.md"

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # macOS images ship Rust through Homebrew (`/opt/homebrew/bin`): image
      # 20261013 has Homebrew rustup with no toolchain, 20261021+ has Homebrew
      # rustup owning a preinstalled stable in `~/.rustup`. Remove the Homebrew
      # formulae, their PATH shims and the image's rustup home, so that on
      # every image `dtolnay/rust-toolchain` finds no rustup, installs its own
      # into `~/.cargo/bin` (prepended to PATH) and a fresh floating stable.
      - name: Remove the image's Homebrew Rust (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for formula in rustup rust; do
            if brew list --formula "$formula" >/dev/null 2>&1; then
              brew uninstall --ignore-dependencies --formula "$formula"
            fi
          done
          for bin in cargo cargo-clippy cargo-fmt clippy-driver rustc rustdoc rustfmt rustup rustup-init; do
            rm -f "/opt/homebrew/bin/$bin"
          done
          rm -rf "$HOME/.rustup"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # `cache-bin: false`: this job installs no cargo binaries, so
      # `~/.cargo/bin` holds only the rustup proxies just installed above, and
      # restoring a copy saved on another runner image left no `cargo` (run
      # 40595898288 attempt 1: `cargo: command not found` on macOS image
      # 20261021 after restoring a Darwin cache saved on 20261013). Without
      # `~/.cargo/bin` the cache path set differs, so `actions/cache` never
      # restores an entry saved with it. An image-version key was not chosen:
      # it would drop the target cache at every image update and still restore
      # `~/.cargo/bin` within one image.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
      # Fail fast, naming the runner image, if no working toolchain is on PATH.
      - name: Toolchain guard (cargo and rustc on PATH)
        shell: bash
        run: |
          if command -v cargo && cargo -V && rustc -V; then
            exit 0
          fi
          echo "::error::no working cargo/rustc on PATH after rust-cache on runner image ${ImageOS:-unknown} ${ImageVersion:-unknown} (${RUNNER_OS:-unknown} ${RUNNER_ARCH:-unknown})"
          exit 1
      - name: Tests (--all-features, at least 32 test targets ok)
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-features --locked 2>&1 | tee test-output.log
          ok=$(sed 's/\x1b\[[0-9;]*m//g' test-output.log | grep -c '^test result: ok' || true)
          echo "test targets ok: $ok"
          if [ "$ok" -lt 32 ]; then
            echo "::error::expected at least 32 'test result: ok' lines, got $ok"
            exit 1
          fi
      - name: Doctests
        run: cargo test --doc --all-features

  i686:
    name: i686
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The 32-bit C runtime and libgcc, needed to link and run i686 test
      # binaries on the x86_64 runner.
      - name: Install gcc-multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      # The ccache count bounds have `target_pointer_width = "32"` arms
      # (`Error::LengthOverflow`) that only run on a 32-bit target.
      - name: ccache tests (--all-features, i686)
        run: cargo test --all-features --target i686-unknown-linux-gnu --test ccache
      - name: DES3 tests (--no-default-features, i686)
        run: cargo test --no-default-features --target i686-unknown-linux-gnu --test crypto_des3
      - name: Check (--all-features, i686)
        run: cargo check --all-features --target i686-unknown-linux-gnu

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dated nightly first, stable last, so `stable` stays the default.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-03
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Rustdoc (stable, core Section 12)
        run: cargo +stable doc --no-deps --all-features
      - name: Rustdoc (nightly-2026-10-03)
        run: cargo +nightly-2026-10-03 doc --no-deps --all-features
      # What docs.rs builds: the default features plus the
      # `[package.metadata.docs.rs]` features, with `--cfg docsrs`, in a fresh
      # target directory so the checked pages come from this build.
      - name: Rustdoc with the docs.rs feature set
        shell: bash
        run: |
          set -euo pipefail
          features="$(python3 scripts/lint-gates/docsrs_check.py --features)"
          RUSTDOCFLAGS="-D warnings --cfg docsrs" cargo +nightly-2026-10-03 doc --no-deps --features "$features" --target-dir "$RUNNER_TEMP/docsrs"
          python3 scripts/lint-gates/docsrs_check.py --verify "$RUNNER_TEMP/docsrs/doc"

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    # Proves compile compatibility with `rust-version = "1.99"`, not lint
    # cleanliness (lints are enforced on stable by `closures`).
    # `--cap-lints=warn` and CARGO_BUILD_WARNINGS=allow neutralise the profile
    # and the committed `build.warnings = "deny"` on the older compiler.
    env:
      RUSTFLAGS: "--cap-lints=warn"
      CARGO_BUILD_WARNINGS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustc +1.99.0 --version && cargo +1.99.0 --version
      - run: cargo +1.99.0 build --all-features --locked

  semver-checks:
    name: semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semver_baseline.py checks every release tag's Cargo.toml version.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `--force` plus the version floor (as rmcp-server-kit): rust-cache can
      # restore an older binary that cannot parse the rustdoc JSON of the
      # current stable.
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked --force --version '^0.51'
      # The baseline is the highest rskrb5-ng version on crates.io at or below
      # the candidate (the registry bytes). An equal version must be this exact
      # package (sha256), else "version already published; bump the version".
      # Only a crate with no published version prints the first-release notice.
      - name: Check release semver (against the highest published rskrb5-ng version)
        run: python3 scripts/lint-gates/semver_baseline.py

  publish-dryrun:
    name: publish-dryrun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo publish --dry-run --locked

  consumer:
    name: consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Build the packaged archive the way a downstream crate vendors it, as a
      # path dependency under `build.warnings = "deny"`: once with the
      # consumer's set (`default-features = false, features = ["tokio"]`),
      # once with default features.
      - name: Vendor the packaged crate into a consumer binary
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked --no-verify
          metadata="$(cargo metadata --format-version 1 --no-deps)"
          target_dir="$(jq -r .target_directory <<<"$metadata")"
          version="$(jq -r '.packages[] | select(.name == "rskrb5-ng") | .version' <<<"$metadata")"
          root="$RUNNER_TEMP/consumer"
          rm -rf "$root"
          mkdir -p "$root/vendor" "$root/app/src" "$root/app/.cargo"
          tar -xzf "$target_dir/package/rskrb5-ng-$version.crate" -C "$root/vendor"
          cp .cargo/config.toml "$root/app/.cargo/config.toml"
          printf 'use rskrb5_ng as _;\n\nfn main() {}\n' > "$root/app/src/main.rs"
          for defaults in false true; do
            printf '%s\n' \
              '[package]' \
              'name = "consumer"' \
              'version = "0.0.0"' \
              'edition = "2024"' \
              'publish = false' \
              '' \
              '[dependencies]' \
              "rskrb5-ng = { path = \"../vendor/rskrb5-ng-$version\", default-features = $defaults, features = [\"tokio\"] }" \
              > "$root/app/Cargo.toml"
            echo "--- consumer: default-features = $defaults"
            (cd "$root/app" && cargo build && cargo test --no-run)
          done
          rm -rf "$root"

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked
      - name: Run cargo vet
        # Exemptions under supply-chain/ pin exact versions and Cargo.lock is
        # committed, so this only changes when a dependency change lands.
        run: cargo vet --locked

  machete:
    name: machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Detect unused dependencies
        run: cargo machete

  taplo:
    name: taplo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install taplo
        run: cargo install taplo-cli --locked
      - name: Check TOML formatting
        # Scoping (include/exclude) lives in .taplo.toml at the repo root.
        run: taplo fmt --check

  docs-validate:
    name: docs-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify vendored guideline checksums
        run: (cd docs/rust-guidelines && sha256sum -c SHA256SUMS)
      - name: Check Markdown links (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress README.md PROVENANCE.md RUST_GUIDELINES.md CHANGELOG.md docs/*.md
          fail: true

  lint-gates:
    name: lint-gates
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-03
          components: clippy
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - name: Run every lint gate self-test
        run: for s in scripts/lint-gates/*.py; do python3 "$s" --self-test || exit 1; done
      - name: Allow gate
        run: python3 scripts/lint-gates/allow_gate.py --enforce
      - name: Exception gate
        run: python3 scripts/lint-gates/exception_gate.py --enforce
      - name: Profile equality
        run: python3 scripts/lint-gates/profile_eq.py --clippy-toml
      - name: Profile completeness against current stable
        run: python3 scripts/lint-gates/completeness_check.py
      - name: Root facade only
        run: python3 scripts/lint-gates/facade_gate.py --enforce
      - name: Whole-tree prose rules
        run: python3 scripts/lint-gates/prose_gate.py --enforce
      - name: The closures matrix lists every feature closure
        run: python3 scripts/lint-gates/feature_closures.py check-ci .github/workflows/ci.yml
      - name: Fuzz lint profile
        run: python3 scripts/lint-gates/fuzz_lint.py --enforce
      # Targets come from fuzz/Cargo.toml, so this needs no cargo-fuzz.
      - name: Fuzz inventory (every parser has a row, every row a live function)
        run: python3 scripts/lint-gates/fuzz_coverage.py --enforce
      - name: No dead options or helpers in the gate scripts
        run: python3 scripts/lint-gates/gate_hygiene.py --enforce
      - name: Gate wiring and action pins
        run: python3 scripts/lint-gates/workflow_gate.py --enforce
      # The offline regression suites of the helper scripts.
      - name: AD dispatch helper self-test
        run: python3 scripts/check-github-ad-gate.py --self-test
      - name: AD environment preflight smoke tests
        run: python3 scripts/check-ad-integration-env-smoke.py
      - name: Fixture runner self-test
        run: bash scripts/run-gated-integration.sh self-test
      - name: Release script self-test
        run: bash scripts/release-publish.sh self-test
      - name: No lint-migration attributes
        run: |
          grep -rn lint-migration src tests examples fuzz && exit 1
          test $? -eq 1

  fuzz-build:
    name: fuzz-build
    runs-on: ubuntu-latest
    # The fuzz crate builds rskrb5-ng as a path dependency on nightly, where
    # the stable profile is not the gate (`closures` is); cap lints there.
    env:
      RUSTFLAGS: "--cap-lints=warn"
      CARGO_BUILD_WARNINGS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-03
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-10-03 install cargo-fuzz --locked
      - name: Build every fuzz target
        shell: bash
        run: |
          set -euo pipefail
          targets="$(cargo +nightly-2026-10-03 fuzz list)"
          test -n "$targets"
          for target in $targets; do
            echo "--- fuzz build $target"
            cargo +nightly-2026-10-03 fuzz build "$target"
          done

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Package (verify build against the registry)
        run: cargo package --locked

  # ---------------------------------------------------------------------------
  # Advisory jobs (informational, core Section 12 "Recommended"). These four
  # are the only jobs allowed to fail without failing the workflow.
  # ---------------------------------------------------------------------------

  geiger:
    name: geiger
    runs-on: ubuntu-latest
    # Informational only: an unsafe-code inventory, never a merge gate. The
    # text output exits 1 on its own "Dependency file was never scanned"
    # warnings (run 40742338863: "error: Found 333 warnings"), which made a
    # completed scan look failed, so the scan writes JSON and
    # `geiger_report.py` classifies those files (build-script output and
    # included non-Rust files) and exits 0 when the scan is complete. Unsafe
    # code in dependencies is a reported result, not a failure; a fatal scan
    # error or an unscanned Rust source fails the step.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
      - name: Run cargo geiger (JSON report)
        run: cargo geiger --all-features --locked --output-format Json > geiger.json 2> geiger.log
      - name: Classify the scan and summarize unsafe counts
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/lint-gates/geiger_report.py geiger.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the geiger report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geiger-report
          path: |
            geiger.json
            geiger.log
          retention-days: 14

  rustdoc-nightly-canary:
    name: rustdoc-nightly-canary
    runs-on: ubuntu-latest
    # Surfaces rustdoc drift on the latest nightly (what docs.rs uses) early;
    # the blocking `docs` job uses the dated, verified pin.
    continue-on-error: true
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +nightly doc --no-deps --all-features

  mutants:
    name: mutants
    # The whole crate, split deterministically into 8 shards (cargo-mutants
    # shards are zero-indexed: `--shard k/8` takes k = 0..7). `--all-features`
    # because cargo-mutants ignores `cfg`: without it every mutant in
    # feature-gated code (`src/http.rs`, the tokio transport) is a false
    # MISSED. No fixed `--timeout`: cargo-mutants derives the per-run cap from
    # the measured baseline test time of each shard.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    # Above the 170m wall of the run step, so the shard ends through
    # `timeout` (and still uploads `mutants.out`) instead of being killed.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    # Mutation runs only need the build to compile. The deny-level profile
    # would make most mutants unviable (a mutant often leaves an unused
    # binding), so lints are capped and warnings let through for this job.
    env:
      CARGO_BUILD_WARNINGS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run cargo mutants (shard ${{ matrix.shard }}/8, wall-capped at 170m)
        # `timeout` reports 124 (or 137 after SIGKILL) when the wall expires:
        # the untested tail is then absent from outcomes.json, which the
        # summary below reports as truncated. cargo-mutants' own statuses
        # (2 = missed mutants, 3 = timeouts) are advisory findings.
        run: |
          set +e
          timeout 170m cargo mutants --all-features --no-shuffle --cap-lints=true --shard ${{ matrix.shard }}/8 -j 2
          status=$?
          set -e
          echo "MUTANTS_STATUS=$status" >> "$GITHUB_ENV"
          if [ "$status" = "124" ] || [ "$status" = "137" ]; then
            echo "TRUNCATED=1" >> "$GITHUB_ENV"
          else
            echo "TRUNCATED=0" >> "$GITHUB_ENV"
          fi
          exit "$status"
      - name: Summarize mutation results (shard ${{ matrix.shard }}/8)
        if: always()
        shell: bash
        run: |
          out=mutants.out
          generated=$(jq 'length' "$out/mutants.json" 2>/dev/null || echo 0)
          total=$(jq '[.outcomes[]? | select(.scenario != "Baseline")] | length' "$out/outcomes.json" 2>/dev/null || echo 0)
          summary=$(jq -r '"caught=\(.caught) missed=\(.missed) unviable=\(.unviable) timeout=\(.timeout) success=\(.success)"' "$out/outcomes.json" 2>/dev/null || echo "no outcomes.json")
          line="shard ${{ matrix.shard }}/8: generated=$generated tested=$total $summary status=${MUTANTS_STATUS:-none} truncated=${TRUNCATED:-unknown}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out-shard-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14

  fuzz:
    name: fuzz
    # Every target `cargo fuzz list` prints, 300 s each on top of the seed
    # corpus. A crash is a finding: the loop runs every target, then fails;
    # the crash inputs are uploaded.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 150
    # The fuzz crate builds rskrb5-ng as a path dependency, so the profile runs
    # on nightly; cap it there (lints are enforced on stable by `closures`).
    env:
      RUSTFLAGS: "--cap-lints=warn"
      CARGO_BUILD_WARNINGS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-03
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-10-03 install cargo-fuzz --locked
      - name: Fuzz every target (300 s each)
        shell: bash
        run: |
          set -uo pipefail
          targets="$(cargo +nightly-2026-10-03 fuzz list)"
          test -n "$targets" || exit 1
          failed=""
          for target in $targets; do
            echo "--- fuzz run $target"
            if ! cargo +nightly-2026-10-03 fuzz run "$target" -- -max_total_time=300 -rss_limit_mb=4096; then
              failed="$failed $target"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzz targets failed:$failed"
            exit 1
          fi
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 14
      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: fuzz/corpus
          retention-days: 14
