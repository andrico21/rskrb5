name: CI

# CI and the release gate: `release.yml` triggers on this workflow's
# completion. Its secret-free `find-tag` job looks for a `vN.N.N` tag at the
# run's head SHA; only then does its `publish` job run, in the reviewed
# `release` environment and only for a tagged commit on `main`. Every job's
# `name:` equals its job id.
#
# Lint profile. The crate adopts the core Section 9 `[lints]` tables of the
# vendored Rust guidelines unchanged, the core `clippy.toml` sample,
# `rustfmt.toml`, and `.cargo/config.toml` `build.warnings = "deny"`, so rustc
# warnings fail every job that does not override it explicitly.
#
# Toolchains (core Section 12 Version Policy). Rust jobs run on floating
# `stable` (never pinned, no `rust-toolchain.toml`). The dated
# `nightly-2026-10-03` is used only for rustfmt, rustdoc and the fuzz crate
# (`fuzz_lint.py`, `fuzz-build`, `fuzz`); `1.99.0` only for the MSRV build.
#
# Lint gates. There is no baseline: the tree passes the profile outright.
# `allow_gate.py` rejects any `allow`; `exception_gate.py` admits only the six
# sanctioned `expect` forms; `profile_eq.py` and `completeness_check.py` hold
# the profile equal to the vendored core and complete against current stable;
# `facade_gate.py` and `prose_gate.py` (whole tree) enforce the source rules;
# `feature_closures.py check-ci` holds the `closures` matrix equal to the
# computed feature closures. See `docs/lint-policy.md`.
#
# Vendored guidelines. `docs/rust-guidelines/` is checked against its
# SHA256SUMS in `docs-validate`; update it only by re-vendoring.
#
# Not in this workflow: the Docker MIT KDC integration gates and the Active
# Directory gate of the upstream `clelange/rskrb5` workflow. They run locally
# (`scripts/run-gated-integration.sh`, docs/gated-integration.md), and
# `workflow_dispatch` below declares no inputs, so
# `scripts/check-github-ad-gate.py --dispatch` refuses to dispatch.
# `docs/gokrb5-parity.toml` keeps their upstream runs as attributed historical
# evidence (gate status `historical-upstream`).
#
# Blocking: every job except the four advisory ones below. Advisory (never a
# merge gate, per core Section 12 "Recommended"): `geiger`,
# `rustdoc-nightly-canary`, and the scheduled/dispatch `fuzz` and `mutants`;
# they are the only jobs allowed to fail.

on:
  push:
    branches: [main]
    # Release tags (`v*`, creatable by repository admins only, per the tag
    # ruleset): `release.yml` publishes only from a green run on the tag.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  schedule:
    # Weekly, Monday 03:37 UTC: the advisory mutants + fuzz pass.
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are denied by the committed .cargo/config.toml ([build] warnings
  # = "deny"), for every job.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-10-03
          components: rustfmt
      - name: rustfmt (crate)
        run: cargo +nightly-2026-10-03 fmt --all -- --check
      - name: rustfmt (fuzz crate)
        run: cargo +nightly-2026-10-03 fmt --manifest-path fuzz/Cargo.toml -- --check

  closures:
    name: closures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every feature closure, as `feature_closures.py list` prints its
        # canonical arguments; `lint-gates` runs `feature_closures.py check-ci`
        # so this list cannot drift from Cargo.toml `[features]`.
        closures:
          - "--no-default-features"
          - "--no-default-features --features messages"
          - "--no-default-features --features serde"
          - "--no-default-features --features messages,serde"
          - "--no-default-features --features spnego"
          - "--no-default-features --features tokio"
          - "--no-default-features --features evaluation"
          - "--no-default-features --features http"
          - "--no-default-features --features serde,spnego"
          - "--no-default-features --features serde,tokio"
          - "--no-default-features --features spnego,tokio"
          - "--no-default-features --features evaluation,http"
          - "--no-default-features --features evaluation,serde"
          - "--no-default-features --features evaluation,tokio"
          - "--no-default-features --features http,serde"
          - "--no-default-features --features http,tokio"
          - "--no-default-features --features tower"
          - "--no-default-features --features serde,spnego,tokio"
          - ""
          - "--no-default-features --features evaluation,http,serde"
          - "--no-default-features --features evaluation,http,tokio"
          - "--no-default-features --features evaluation,tower"
          - "--no-default-features --features evaluation,serde,tokio"
          - "--no-default-features --features http,serde,tokio"
          - "--no-default-features --features serde,tower"
          - "--no-default-features --features tokio,tower"
          - "--features evaluation"
          - "--features http"
          - "--no-default-features --features evaluation,http,serde,tokio"
          - "--no-default-features --features evaluation,serde,tower"
          - "--no-default-features --features evaluation,tokio,tower"
          - "--no-default-features --features serde,tokio,tower"
          - "--features evaluation,http"
          - "--features tower"
          - "--no-default-features --features evaluation,serde,tokio,tower"
          - "--all-features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: closure-${{ strategy.job-index }}
      - name: Clippy (${{ matrix.closures }})
        run: cargo clippy --all-targets ${{ matrix.closures }} -- -D warnings
      - name: Test (${{ matrix.closures }})
        run: cargo test ${{ matrix.closures }}

  clippy-windows:
    name: clippy-windows
    # Code that is dead outside `cfg(unix)` only fails on a Windows target.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy (--all-features, Windows)
        run: cargo clippy --all-targets --all-features -- -D warnings

  lib-feature-sets:
    name: lib-feature-sets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Library-only and binary-only builds a path-dependency consumer or
        # the README can select. `cargo check` keeps the committed
        # `build.warnings = "deny"`.
        args:
          - "--lib --no-default-features --features messages"
          - "--lib --no-default-features --features spnego"
          - "--lib --no-default-features --features http"
          - "--lib --no-default-features --features evaluation"
          - "--no-default-features --features evaluation --bin rskrb5-ng-compat-report"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check (${{ matrix.args }})
        run: cargo check ${{ matrix.args }}

  readme-commands:
    name: readme-commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # README "Examples": the Axum example with only the `http` feature.
      - name: Build the axum-negotiate example (--no-default-features --features http)
        run: cargo build --example axum-negotiate --features http --no-default-features
      # README "Compatibility report", as the prek `compat-report` hook runs it.
      - name: The compatibility report is current
        run: |
          cargo run --quiet --no-default-features --features evaluation --bin rskrb5-ng-compat-report > "$RUNNER_TEMP/compatibility-report.md"
          diff -u docs/compatibility-report.md "$RUNNER_TEMP/compatibility-report.md"

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove Homebrew rust shim (macOS arm64 PATH precedence)
        if: runner.os == 'macOS'
        run: |
          brew uninstall --ignore-dependencies rustup rust 2>/dev/null || true
          rm -f /opt/homebrew/bin/cargo /opt/homebrew/bin/rustc /opt/homebrew/bin/rustup /opt/homebrew/bin/rustup-init
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Tests (--all-features, at least 32 test targets ok)
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-features --locked 2>&1 | tee test-output.log
          ok=$(sed 's/\x1b\[[0-9;]*m//g' test-output.log | grep -c '^test result: ok' || true)
          echo "test targets ok: $ok"
          if [ "$ok" -lt 32 ]; then
            echo "::error::expected at least 32 'test result: ok' lines, got $ok"
            exit 1
          fi
      - name: Doctests
        run: cargo test --doc --all-features

  i686:
    name: i686
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The 32-bit C runtime and libgcc, needed to link and run i686 test
      # binaries on the x86_64 runner.
      - name: Install gcc-multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      # The ccache count bounds have `target_pointer_width = "32"` arms
      # (`Error::LengthOverflow`) that only run on a 32-bit target.
      - name: ccache tests (--all-features, i686)
        run: cargo test --all-features --target i686-unknown-linux-gnu --test ccache
      - name: DES3 tests (--no-default-features, i686)
        run: cargo test --no-default-features --target i686-unknown-linux-gnu --test crypto_des3
      - name: Check (--all-features, i686)
        run: cargo check --all-features --target i686-unknown-linux-gnu

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dated nightly first, stable last, so `stable` stays the default.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-10-03
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Rustdoc (stable, core Section 12)
        run: cargo +stable doc --no-deps --all-features
      - name: Rustdoc (nightly-2026-10-03)
        run: cargo +nightly-2026-10-03 doc --no-deps --all-features

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    # Proves compile compatibility with `rust-version = "1.99"`, not lint
    # cleanliness (lints are enforced on stable by `closures`).
    # `--cap-lints=warn` and CARGO_BUILD_WARNINGS=allow neutralise the profile
    # and the committed `build.warnings = "deny"` on the older compiler.
    env:
      RUSTFLAGS: "--cap-lints=warn"
      CARGO_BUILD_WARNINGS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: rustc +1.99.0 --version && cargo +1.99.0 --version
      - run: cargo +1.99.0 build --all-features --locked

  semver-checks:
    name: semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semver_baseline.py reads every release tag's Cargo.toml.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--force` plus the version floor (as rmcp-server-kit): rust-cache can
      # restore an older binary that cannot parse the rustdoc JSON of the
      # current stable.
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked --force --version '^0.50'
      # The baseline is the highest `vX.Y.Z` tag that names `rskrb5-ng` below
      # the candidate version and is published on crates.io; without one (the
      # first rskrb5-ng release) the script prints a notice and exits 0.
      - name: Check release semver (against the latest published rskrb5-ng tag)
        run: python3 scripts/lint-gates/semver_baseline.py

  publish-dryrun:
    name: publish-dryrun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo publish --dry-run --locked

  consumer:
    name: consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Build the packaged archive the way a downstream crate vendors it, as a
      # path dependency under `build.warnings = "deny"`: once with the
      # consumer's set (`default-features = false, features = ["tokio"]`),
      # once with default features.
      - name: Vendor the packaged crate into a consumer binary
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked --no-verify
          metadata="$(cargo metadata --format-version 1 --no-deps)"
          target_dir="$(jq -r .target_directory <<<"$metadata")"
          version="$(jq -r '.packages[] | select(.name == "rskrb5-ng") | .version' <<<"$metadata")"
          root="$RUNNER_TEMP/consumer"
          rm -rf "$root"
          mkdir -p "$root/vendor" "$root/app/src" "$root/app/.cargo"
          tar -xzf "$target_dir/package/rskrb5-ng-$version.crate" -C "$root/vendor"
          cp .cargo/config.toml "$root/app/.cargo/config.toml"
          printf 'use rskrb5_ng as _;\n\nfn main() {}\n' > "$root/app/src/main.rs"
          for defaults in false true; do
            printf '%s\n' \
              '[package]' \
              'name = "consumer"' \
              'version = "0.0.0"' \
              'edition = "2024"' \
              'publish = false' \
              '' \
              '[dependencies]' \
              "rskrb5-ng = { path = \"../vendor/rskrb5-ng-$version\", default-features = $defaults, features = [\"tokio\"] }" \
              > "$root/app/Cargo.toml"
            echo "--- consumer: default-features = $defaults"
            (cd "$root/app" && cargo build && cargo test --no-run)
          done
          rm -rf "$root"

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked
      - name: Run cargo vet
        # Exemptions under supply-chain/ pin exact versions and Cargo.lock is
        # committed, so this only changes when a dependency change lands.
        run: cargo vet --locked

  machete:
    name: machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Detect unused dependencies
        run: cargo machete

  taplo:
    name: taplo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install taplo
        run: cargo install taplo-cli --locked
      - name: Check TOML formatting
        # Scoping (include/exclude) lives in .taplo.toml at the repo root.
        run: taplo fmt --check

  docs-validate:
    name: docs-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify vendored guideline checksums
        run: (cd docs/rust-guidelines && sha256sum -c SHA256SUMS)
      - name: Check Markdown links (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --include-fragments --no-progress README.md RUST_GUIDELINES.md CHANGELOG.md docs/*.md
          fail: true

  lint-gates:
    name: lint-gates
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-10-03
          components: clippy
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - name: Run every lint gate self-test
        run: for s in scripts/lint-gates/*.py; do python3 "$s" --self-test || exit 1; done
      - name: Allow gate
        run: python3 scripts/lint-gates/allow_gate.py --enforce
      - name: Exception gate
        run: python3 scripts/lint-gates/exception_gate.py --enforce
      - name: Profile equality
        run: python3 scripts/lint-gates/profile_eq.py --clippy-toml
      - name: Profile completeness against current stable
        run: python3 scripts/lint-gates/completeness_check.py
      - name: Root facade only
        run: python3 scripts/lint-gates/facade_gate.py --enforce
      - name: Whole-tree prose rules
        run: python3 scripts/lint-gates/prose_gate.py --enforce
      - name: The closures matrix lists every feature closure
        run: python3 scripts/lint-gates/feature_closures.py check-ci .github/workflows/ci.yml
      - name: Fuzz lint profile
        run: python3 scripts/lint-gates/fuzz_lint.py --enforce
      - name: No lint-migration attributes
        run: |
          grep -rn lint-migration src tests examples fuzz && exit 1
          test $? -eq 1

  fuzz-build:
    name: fuzz-build
    runs-on: ubuntu-latest
    # The fuzz crate builds rskrb5-ng as a path dependency on nightly, where
    # the stable profile is not the gate (`closures` is); cap lints there.
    env:
      RUSTFLAGS: "--cap-lints=warn"
      CARGO_BUILD_WARNINGS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-10-03
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-10-03 install cargo-fuzz --locked
      - name: Build every fuzz target
        shell: bash
        run: |
          set -euo pipefail
          targets="$(cargo +nightly-2026-10-03 fuzz list)"
          test -n "$targets"
          for target in $targets; do
            echo "--- fuzz build $target"
            cargo +nightly-2026-10-03 fuzz build "$target"
          done

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Package (verify build against the registry)
        run: cargo package --locked

  # ---------------------------------------------------------------------------
  # Advisory jobs (informational, core Section 12 "Recommended"). These four
  # are the only jobs allowed to fail without failing the workflow.
  # ---------------------------------------------------------------------------

  geiger:
    name: geiger
    runs-on: ubuntu-latest
    # Informational only: cargo-geiger exits non-zero whenever it finds unsafe
    # code (including in dependencies), so it must never gate merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
      - name: Run cargo geiger
        run: cargo geiger --all-features

  rustdoc-nightly-canary:
    name: rustdoc-nightly-canary
    runs-on: ubuntu-latest
    # Surfaces rustdoc drift on the latest nightly (what docs.rs uses) early;
    # the blocking `docs` job uses the dated, verified pin.
    continue-on-error: true
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@0e28dd9a7764e5f83064112bb1f24025a14c313c # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +nightly doc --no-deps --all-features

  mutants:
    name: mutants
    # Scoped to two small files so a run finishes inside the wall.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 75
    # Mutation runs only need the build to compile. The deny-level profile
    # would make most mutants unviable (a mutant often leaves an unused
    # binding), so lints are capped and warnings let through for this job.
    env:
      CARGO_BUILD_WARNINGS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run cargo mutants (advisory, wall-capped at 60m)
        run: timeout 60m cargo mutants --no-shuffle --cap-lints=true --timeout 120 -j 4 -f src/kadmin.rs -f src/client/transport.rs
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-out
          path: mutants.out
          retention-days: 14

  fuzz:
    name: fuzz
    # Bounded smoke runs on arbitrary input: `kpasswd_reply` (the kadmin
    # frame parsers) and `ccache_parse` (the ccache reader). A crash is a
    # finding and surfaces through the advisory status.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    # The fuzz crate builds rskrb5-ng as a path dependency, so the profile runs
    # on nightly; cap it there (lints are enforced on stable by `closures`).
    env:
      RUSTFLAGS: "--cap-lints=warn"
      CARGO_BUILD_WARNINGS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-10-03
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz kpasswd_reply (bounded)
        run: cargo +nightly-2026-10-03 fuzz run kpasswd_reply -- -max_total_time=300 -rss_limit_mb=4096
      - name: Fuzz ccache_parse (bounded)
        if: success() || failure()
        run: cargo +nightly-2026-10-03 fuzz run ccache_parse -- -max_total_time=300 -rss_limit_mb=4096
      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-corpus
          path: fuzz/corpus
          retention-days: 14
