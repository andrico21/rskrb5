name: CI

# Fork-local CI and the release gate: `release.yml` triggers on this
# workflow's completion and publishes `rskrb5-patched` when a `vN.N.N` tag
# points at the run's head SHA. Every job's `name:` equals its job id.
#
# Lint profile. The crate adopts the strictest-union profile: the core
# Section 9 `[lints]` tables of the vendored Rust guidelines (identical to
# rmcp-server-kit@b7f6b66), the core `clippy.toml` sample, rmcp's
# `rustfmt.toml`, and `.cargo/config.toml` `build.warnings = "deny"`, so
# rustc warnings fail every job that does not override it explicitly.
#
# Toolchains (core Section 12 Version Policy). Rust jobs run on floating
# `stable` (never pinned, no `rust-toolchain.toml`). The dated
# `nightly-2026-10-03` (rmcp-server-kit's pin) is used only for rustfmt and
# rustdoc, and `1.99.0` only for the MSRV build.
#
# Baseline and ratchet. Upstream diagnostics the profile names are baselined
# only through generated, item-level `lint-migration:` expect attributes,
# listed in `scripts/lint-ratchet/baseline.toml`. `baseline_gate.py` enforces
# that the manifest matches the source and only ever shrinks; `allow_gate.py`
# rejects any `allow`; `profile_eq.py` and `completeness_check.py` hold the
# profile equal to the vendored core and complete against current stable.
# `fork_lines_gate.py` and `prose_gate.py` are differential: fork-authored
# lines must add no lint diagnostic (K1-K7 and rustdoc) and no core prose-rule
# violation.
#
# Vendored guidelines. `docs/rust-guidelines/` is checked against its
# SHA256SUMS in `docs-validate`; update it only by re-vendoring.
#
# Blocking: every lint, test, doc, MSRV, consumer, supply-chain and gate job.
# Advisory (never a merge gate, per core Section 12 "Recommended"): `geiger`,
# `rustdoc-nightly-canary`, and the scheduled `mutants` and `fuzz` jobs.
# GitHub runs scheduled workflows from the default branch; dispatch the
# advisory pass against the release line with
# `gh workflow run ci.yml --ref release/0.3.0`.

on:
  push:
    branches: [main, "release/**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  schedule:
    # Weekly, Monday 03:37 UTC: the advisory mutants + fuzz pass.
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are denied by the committed .cargo/config.toml ([build] warnings
  # = "deny"), for every job.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-10-03
          components: rustfmt
      - name: rustfmt (crate)
        run: cargo +nightly-2026-10-03 fmt --all -- --check
      - name: rustfmt (fuzz crate)
        run: cargo +nightly-2026-10-03 fmt --manifest-path fuzz/Cargo.toml -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy (--all-features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: rustc warnings denied across every target (core Section 12)
        run: CARGO_BUILD_WARNINGS=deny cargo check --all-targets --all-features --keep-going

  features-matrix:
    name: features-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # K1-K7; K7 is the downstream consumer's feature set.
        features:
          - "--all-features"
          - ""
          - "--no-default-features"
          - "--features http"
          - "--features tower"
          - "--features evaluation"
          - "--no-default-features --features tokio"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build (${{ matrix.features }})
        run: cargo build ${{ matrix.features }}
      # The `clippy` job only lints `--all-features`; code under
      # `cfg(not(feature = ...))` is linted only here.
      - name: Clippy (${{ matrix.features }})
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
      - name: Test (${{ matrix.features }})
        run: cargo test ${{ matrix.features }}

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove Homebrew rust shim (macOS arm64 PATH precedence)
        if: runner.os == 'macOS'
        run: |
          brew uninstall --ignore-dependencies rustup rust 2>/dev/null || true
          rm -f /opt/homebrew/bin/cargo /opt/homebrew/bin/rustc /opt/homebrew/bin/rustup /opt/homebrew/bin/rustup-init
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Tests (--all-features, at least 32 test targets ok)
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-features --locked 2>&1 | tee test-output.log
          ok=$(sed 's/\x1b\[[0-9;]*m//g' test-output.log | grep -c '^test result: ok' || true)
          echo "test targets ok: $ok"
          if [ "$ok" -lt 32 ]; then
            echo "::error::expected at least 32 'test result: ok' lines, got $ok"
            exit 1
          fi
      - name: Doctests
        run: cargo test --doc --all-features

  i686:
    name: i686
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-features --target i686-unknown-linux-gnu

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dated nightly first, stable last, so `stable` stays the default.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-10-03
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Rustdoc (stable, core Section 12)
        run: cargo +stable doc --no-deps --all-features
      - name: Rustdoc (nightly-2026-10-03)
        run: cargo +nightly-2026-10-03 doc --no-deps --all-features

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    # Proves compile compatibility with `rust-version = "1.99"`, not lint
    # cleanliness (lints are enforced on stable by `clippy`).
    # `--cap-lints=warn` and CARGO_BUILD_WARNINGS=allow neutralise the profile
    # and the committed `build.warnings = "deny"` on the older compiler.
    env:
      RUSTFLAGS: "--cap-lints=warn"
      CARGO_BUILD_WARNINGS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: rustc +1.99.0 --version && cargo +1.99.0 --version
      - run: cargo +1.99.0 build --all-features --locked

  semver-checks:
    name: semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--force` plus the version floor (as rmcp-server-kit): rust-cache can
      # restore an older binary that cannot parse the rustdoc JSON of the
      # current stable.
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked --force --version '^0.50'
      - name: Check release semver (against the latest published rskrb5-patched)
        run: cargo semver-checks check-release

  publish-dryrun:
    name: publish-dryrun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo publish --dry-run --locked

  consumer:
    name: consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Build the packaged archive the way a downstream crate vendors it, as a
      # path dependency under `build.warnings = "deny"`: once with the
      # consumer's set (`default-features = false, features = ["tokio"]`),
      # once with default features.
      - name: Vendor the packaged crate into a consumer binary
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked --no-verify
          metadata="$(cargo metadata --format-version 1 --no-deps)"
          target_dir="$(jq -r .target_directory <<<"$metadata")"
          version="$(jq -r '.packages[] | select(.name == "rskrb5-patched") | .version' <<<"$metadata")"
          root="$RUNNER_TEMP/consumer"
          rm -rf "$root"
          mkdir -p "$root/vendor" "$root/app/src" "$root/app/.cargo"
          tar -xzf "$target_dir/package/rskrb5-patched-$version.crate" -C "$root/vendor"
          cp .cargo/config.toml "$root/app/.cargo/config.toml"
          printf 'use rskrb5 as _;\n\nfn main() {}\n' > "$root/app/src/main.rs"
          for defaults in false true; do
            printf '%s\n' \
              '[package]' \
              'name = "consumer"' \
              'version = "0.0.0"' \
              'edition = "2024"' \
              'publish = false' \
              '' \
              '[dependencies]' \
              "rskrb5 = { path = \"../vendor/rskrb5-patched-$version\", package = \"rskrb5-patched\", default-features = $defaults, features = [\"tokio\"] }" \
              > "$root/app/Cargo.toml"
            echo "--- consumer: default-features = $defaults"
            (cd "$root/app" && cargo build && cargo test --no-run)
          done
          rm -rf "$root"

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked
      - name: Run cargo vet
        # Exemptions under supply-chain/ pin exact versions and Cargo.lock is
        # committed, so this only changes when a dependency change lands.
        run: cargo vet --locked

  machete:
    name: machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Detect unused dependencies
        run: cargo machete

  taplo:
    name: taplo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install taplo
        run: cargo install taplo-cli --locked
      - name: Check TOML formatting
        # Scoping (include/exclude) lives in .taplo.toml at the repo root.
        run: taplo fmt --check

  docs-validate:
    name: docs-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify vendored guideline checksums
        run: (cd docs/rust-guidelines && sha256sum -c SHA256SUMS)
      - name: Check Markdown links (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --include-fragments --no-progress README.md RUST_GUIDELINES.md FORK-NOTES.md CHANGELOG.md docs/*.md
          fail: true

  lint-gates:
    name: lint-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # baseline_gate.py walks the manifest history back to its ratchet base.
          fetch-depth: 0
      # stdlib-only Python (>= 3.11, tomllib). Stable clippy is needed only by
      # completeness_check.py (`clippy-driver -W help`); nothing is compiled.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - name: Run every lint-ratchet self-test
        run: for s in scripts/lint-ratchet/*.py; do python3 "$s" --self-test || exit 1; done
      - name: Allow gate
        run: python3 scripts/lint-ratchet/allow_gate.py --enforce
      - name: Profile equality
        run: python3 scripts/lint-ratchet/profile_eq.py --clippy-toml
      - name: Profile completeness against current stable
        run: python3 scripts/lint-ratchet/completeness_check.py
      - name: Baseline manifest and ratchet
        run: python3 scripts/lint-ratchet/baseline_gate.py --enforce

  fork-lines:
    name: fork-lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gates rebuild the upstream reference tree from git history.
          fetch-depth: 0
      # Dated nightly first (rustfmt of the reference tree), stable last so it
      # stays the default for the K1-K7 clippy and rustdoc runs.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-10-03
          components: rustfmt
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Fork lines add no lint diagnostic (K1-K7, rustdoc, fuzz)
        run: python3 scripts/lint-ratchet/fork_lines_gate.py --enforce
      - name: Fork-touched items follow the core prose rules
        run: python3 scripts/lint-ratchet/prose_gate.py --enforce

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Package (verify build against the registry)
        run: cargo package --locked

  # ---------------------------------------------------------------------------
  # Advisory jobs (informational, core Section 12 "Recommended" tools). These
  # four are the only jobs allowed to fail without failing the workflow.
  # ---------------------------------------------------------------------------

  geiger:
    name: geiger
    runs-on: ubuntu-latest
    # Informational only: cargo-geiger exits non-zero whenever it finds unsafe
    # code (including in dependencies), so it must never gate merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
      - name: Run cargo geiger
        run: cargo geiger --all-features

  rustdoc-nightly-canary:
    name: rustdoc-nightly-canary
    runs-on: ubuntu-latest
    # Surfaces rustdoc drift on the latest nightly (what docs.rs uses) early;
    # the blocking `docs` job uses the dated, verified pin.
    continue-on-error: true
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@0e28dd9a7764e5f83064112bb1f24025a14c313c # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +nightly doc --no-deps --all-features

  mutants:
    name: mutants
    # Scoped to the two smallest patch-dense files first - patch 0002's remote
    # reply parser and patch 0012's transport - so a run finishes inside the
    # wall; widen the `-f` list (src/config.rs, src/client.rs) once a green run
    # shows headroom.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 75
    # Mutation runs only need the build to compile. The deny-level profile
    # would make most mutants unviable (a mutant often leaves an unused
    # binding), so lints are capped and warnings let through for this job.
    env:
      CARGO_BUILD_WARNINGS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run cargo mutants (advisory, wall-capped at 60m)
        run: timeout 60m cargo mutants --no-shuffle --cap-lints=true --timeout 120 -j 4 -f src/kadmin.rs -f src/client/transport.rs
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-out
          path: mutants.out
          retention-days: 14

  fuzz:
    name: fuzz
    # Bounded smoke runs of the fork's fuzz targets on arbitrary input:
    # `kpasswd_reply` (the kadmin frame parsers patch 0002 touches) and
    # `ccache_parse` (the ccache reader). A crash is a finding (upstream or
    # patch) and surfaces through the advisory status.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    # The fuzz crate builds rskrb5 as a path dependency, so the profile runs
    # on nightly; cap it there (lints are enforced on stable by `clippy`).
    env:
      RUSTFLAGS: "--cap-lints=warn"
      CARGO_BUILD_WARNINGS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-10-03
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz kpasswd_reply (bounded)
        run: cargo +nightly-2026-10-03 fuzz run kpasswd_reply -- -max_total_time=300 -rss_limit_mb=4096
      - name: Fuzz ccache_parse (bounded)
        if: success() || failure()
        run: cargo +nightly-2026-10-03 fuzz run ccache_parse -- -max_total_time=300 -rss_limit_mb=4096
      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-corpus
          path: fuzz/corpus
          retention-days: 14
