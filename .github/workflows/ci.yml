name: CI

# Fork-local CI. `release.yml` triggers on this workflow's completion and
# publishes `rskrb5-patched` when a `vN.N.N` tag points at the run's head SHA,
# so this workflow is the release gate.
#
# The code under test is upstream `rskrb5` at `v0.2.0` plus the patch series
# (FORK-NOTES.md) - byte-for-byte what consumers vendor - so the tree is not
# re-linted to taste here. `clippy -D warnings` on current stable still names
# sites in upstream's own files (`chunks_exact` -> `as_chunks`, a 1.99 lint)
# alongside a `collapsible_if` in the patch series, so the lint step is
# advisory: the fork will not diverge from the vendored bytes for lints the
# upstream baseline never ran. Build, tests, docs and packaging are blocking.

on:
  push:
    branches: [main, "release/**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, test, docs, package (ubuntu, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Build without default features
        run: cargo check --no-default-features

      - name: Clippy (advisory - see the header)
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      - name: Docs
        run: cargo doc --no-deps --all-features

      - name: Package (verify build against the registry)
        run: cargo package --locked
